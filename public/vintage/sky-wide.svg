<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3733"/>
      <stop offset="0.5" stop-color="#57534d"/>
      <stop offset="1" stop-color="#2a2723"/>
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.22 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft3"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="vign3" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain3)">
    <rect width="1600" height="500" fill="url(#sky3)"/>
    <ellipse cx="400" cy="120" rx="480" ry="46" fill="#6a655e" opacity="0.5" filter="url(#soft3)"/>
    <ellipse cx="1200" cy="200" rx="520" ry="52" fill="#484440" opacity="0.6" filter="url(#soft3)"/>
    <ellipse cx="900" cy="420" rx="700" ry="60" fill="#211f1c" opacity="0.7" filter="url(#soft3)"/>
    <!-- long dark object -->
    <g filter="url(#soft3)">
      <ellipse cx="820" cy="235" rx="180" ry="26" fill="#141210"/>
      <ellipse cx="820" cy="222" rx="80" ry="14" fill="#1d1a17"/>
    </g>
  </g>
  <rect width="1600" height="500" fill="url(#vign3)"/>
</svg>
