<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3cec4"/>
      <stop offset="0.6" stop-color="#a29c92"/>
      <stop offset="1" stop-color="#615c54"/>
    </linearGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.2 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft4"><feGaussianBlur stdDeviation="1.4"/></filter>
    <radialGradient id="vign4" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain4)">
    <rect width="800" height="560" fill="url(#sky4)"/>
    <!-- water -->
    <rect y="380" width="800" height="180" fill="#77716a"/>
    <g stroke="#8d877f" stroke-width="3" opacity="0.6">
      <path d="M40 420 h180 M300 445 h240 M120 480 h150 M520 470 h200 M420 510 h160"/>
    </g>
    <!-- reeds -->
    <g stroke="#2c2925" stroke-width="4" fill="none">
      <path d="M90 560 C86 480 96 430 84 380"/>
      <path d="M120 560 C124 470 112 420 122 372"/>
      <path d="M150 560 C144 490 158 440 148 400"/>
      <path d="M660 560 C664 480 652 440 662 396"/>
      <path d="M700 560 C694 490 708 450 698 410"/>
    </g>
    <!-- wading bird silhouette -->
    <g fill="#211f1b" transform="translate(400 330)">
      <ellipse cx="0" cy="0" rx="46" ry="24"/>
      <path d="M34 -10 C52 -34 58 -52 64 -66 L70 -62 C64 -46 60 -30 46 -6 Z"/>
      <circle cx="66" cy="-68" r="9"/>
      <path d="M73 -70 L108 -64 L73 -60 Z"/>
      <path d="M-8 20 L-6 88 L-2 88 L-2 20 Z M10 20 L12 88 L16 88 L14 20 Z"/>
      <path d="M-40 -8 C-58 -2 -64 8 -70 18 L-64 22 C-56 12 -48 6 -34 2 Z"/>
    </g>
  </g>
  <rect width="800" height="560" fill="url(#vign4)"/>
</svg>
