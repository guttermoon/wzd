<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c4ba"/>
      <stop offset="1" stop-color="#8a847b"/>
    </linearGradient>
    <filter id="grain6">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.2 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft6"><feGaussianBlur stdDeviation="1.5"/></filter>
    <radialGradient id="vign6" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain6)">
    <rect width="800" height="620" fill="url(#sky6)"/>
    <!-- rocky ground -->
    <path d="M0 340 Q160 300 320 330 T640 320 T800 335 L800 620 L0 620 Z" fill="#6e6860"/>
    <path d="M0 430 Q200 390 420 420 T800 410 L800 620 L0 620 Z" fill="#57524a"/>
    <!-- boulders -->
    <g fill="#3b3731">
      <ellipse cx="150" cy="470" rx="70" ry="34"/>
      <ellipse cx="240" cy="500" rx="40" ry="22"/>
      <ellipse cx="620" cy="480" rx="86" ry="38"/>
      <ellipse cx="520" cy="520" rx="46" ry="20"/>
    </g>
    <g fill="#48443d">
      <ellipse cx="152" cy="458" rx="52" ry="22"/>
      <ellipse cx="618" cy="468" rx="62" ry="24"/>
    </g>
    <!-- crouching figure -->
    <g fill="#211f1b" transform="translate(370 430)" filter="url(#soft6)">
      <circle cx="14" cy="-58" r="11"/>
      <path d="M4 -48 C-6 -40 -12 -26 -12 -10 L-16 18 L-4 18 L0 -6 C2 -14 10 -20 20 -20 L34 -20 L38 6 L48 6 L44 -28 C42 -42 30 -50 18 -50 Z"/>
      <path d="M20 -44 C32 -40 42 -34 50 -24 L44 -18 C36 -26 28 -32 18 -36 Z"/>
    </g>
  </g>
  <rect width="800" height="620" fill="url(#vign6)"/>
</svg>
