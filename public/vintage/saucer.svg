<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcac0"/>
      <stop offset="0.55" stop-color="#a8a29a"/>
      <stop offset="1" stop-color="#6f6a63"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.18 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain)">
    <rect width="800" height="600" fill="url(#sky)"/>
    <!-- cloud bands -->
    <ellipse cx="180" cy="140" rx="260" ry="38" fill="#bdb8ae" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="620" cy="90" rx="300" ry="30" fill="#c6c1b7" opacity="0.4" filter="url(#soft)"/>
    <ellipse cx="430" cy="500" rx="420" ry="60" fill="#5d5952" opacity="0.55" filter="url(#soft)"/>
    <!-- treeline -->
    <path d="M0 560 Q90 520 160 545 T330 540 T520 550 T700 535 T800 550 L800 600 L0 600 Z" fill="#2e2b27"/>
    <!-- the object -->
    <g filter="url(#soft)">
      <ellipse cx="470" cy="215" rx="78" ry="16" fill="#26231f"/>
      <ellipse cx="470" cy="204" rx="34" ry="12" fill="#33302b"/>
      <ellipse cx="470" cy="222" rx="78" ry="6" fill="#1c1a17" opacity="0.8"/>
    </g>
  </g>
  <rect width="800" height="600" fill="url(#vign)"/>
</svg>
